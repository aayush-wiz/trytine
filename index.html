<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- company icon: the blue cursor from the hero -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- warm the hero animation's image so it renders without delay -->
    <link rel="preload" as="image" href="/assets/coder-small.png" />

    <title>Tine | A second cursor that works for you</title>
    <meta
      name="description"
      content="Tine is a second cursor for your Mac — it watches what you're doing, helps where it can, and, on your say-so, takes the screen and gets the work done for you."
    />

    <!-- Link-share preview (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trytine.com/" />
    <meta property="og:site_name" content="Tine" />
    <meta property="og:title" content="Tine | A second cursor that works for you" />
    <meta
      property="og:description"
      content="A second cursor for your Mac that watches, helps, and gets the work done for you."
    />
    <meta property="og:image" content="https://trytine.com/perch-og.jpg" />
    <meta property="og:image:width" content="2656" />
    <meta property="og:image:height" content="1488" />
    <meta property="og:image:alt" content="A second cursor that works for you on your PC" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tine | A second cursor that works for you" />
    <meta
      name="twitter:description"
      content="A second cursor for your Mac that watches, helps, and gets the work done for you."
    />
    <meta name="twitter:image" content="https://trytine.com/perch-og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>
