<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body { overflow:hidden; font-family:'Inter',-apple-system,sans-serif;
         display:flex; align-items:flex-start; justify-content:center; background:transparent; }
  .mono { font-family:ui-monospace,'SF Mono',Menlo,monospace; }

  #stage { position:relative; width:1000px; height:650px; flex:none; transform-origin:top center; }

  /* dark notch/panel — charcoal gradient like the app (surfaceTop #0d0d0d → surfaceBot #000) */
  .panel { background:linear-gradient(180deg,#0d0d0d 0%, #000 100%); box-shadow:0 22px 50px -14px rgba(0,0,0,0.55); }

  /* ── NEUTRAL pill (hangs from the top edge) ── */
  #pill { position:absolute; top:0; left:50%; margin-left:-150px; width:300px; height:50px;
          border-radius:0 0 24px 24px; display:flex; align-items:center; padding:0 22px; z-index:6;
          transition:opacity .3s ease; }
  #pill .mid { flex:1; display:flex; align-items:center; justify-content:center; gap:11px; }
  #pill .gdot { width:10px; height:10px; border-radius:50%; background:#2fcf4e; }
  #pill .nm { color:#fff; font-weight:600; font-size:18px; }

  /* ── EXPANDED command panel ── */
  #panel { position:absolute; top:0; left:50%; margin-left:-320px; width:640px;
           border-radius:0 0 26px 26px; padding:20px 22px 12px; opacity:0; z-index:5;
           transition:opacity .35s ease; }
  #panel .head { display:flex; align-items:center; gap:11px; margin-bottom:16px; }
  #panel .head .gdot { width:10px; height:10px; border-radius:50%; background:#2fcf4e; }
  #panel .head .nm { color:#fff; font-weight:700; font-size:19px; }
  #panel .head .sp { flex:1; }
  #panel .head svg { opacity:.8; }

  /* input pill */
  .well { background:#1a1a1c; border-radius:16px; padding:13px 16px; display:flex; align-items:center; min-height:52px; }
  #ph { color:#8a8a8e; font-size:15px; flex:1; white-space:nowrap; overflow:hidden; }
  #ph.typed { color:#f2f2f4; }
  #caret { display:inline-block; width:2px; height:18px; background:#fff; margin-left:1px; vertical-align:middle; opacity:0; }
  #send { width:30px; height:30px; border-radius:50%; background:#fff; flex:none; display:flex; align-items:center; justify-content:center; margin-left:10px; }

  /* step log + thinking box */
  #log { margin-top:14px; min-height:0; max-height:230px; overflow:hidden; opacity:0; transition:opacity .3s ease; }
  .row { display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.5; padding:2px 0; }
  .row .ic { flex:none; margin-top:1px; }
  .row.user .tx { color:#9a9a9e; font-weight:500; }
  .row.step .tx { color:#8c8c90; padding-left:18px; }
  .row.think .tx { color:#9a9a9e; }
  .row .tx { white-space:pre-wrap; }

  /* completion card — app icon tile + result + green check (mirrors the voice section) */
  .donecard { margin-top:10px; display:flex; align-items:center; gap:11px; background:#161618; border-radius:13px; padding:12px 14px; opacity:0; transform:translateY(6px); transition:opacity .35s ease, transform .35s ease; }
  .donecard.show { opacity:1; transform:translateY(0); }
  .donecard .app { width:30px; height:30px; border-radius:7px; flex:none; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .donecard .app svg { width:20px; height:20px; display:block; }
  .donecard .meta { min-width:0; }
  .donecard .t1 { color:#f2f2f4; font-size:13.5px; font-weight:600; }
  .donecard .t2 { color:#8c8c90; font-size:12px; margin-top:1px; }
  .donecard .chk { margin-left:auto; width:22px; height:22px; border-radius:50%; background:#1f8a5b; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }

  #chev { display:flex; justify-content:center; margin-top:10px; }

  /* cursor */
  #cursor { position:absolute; top:0; left:0; opacity:0; transform:translate(840px,360px) scale(1);
            transition:transform .85s cubic-bezier(.4,0,.2,1), opacity .3s ease; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35)); z-index:30; }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
</style>
</head>
<body>
  <div id="stage">

    <!-- NEUTRAL -->
    <div id="pill" class="panel">
      <span style="display:flex;align-items:center;gap:9px;flex:none;">
        <svg width="20" height="16" viewBox="0 0 20 18" fill="none"><rect x="1" y="1" width="18" height="16" rx="4" stroke="#d6d6da" stroke-width="1.6"/><line x1="7.5" y1="1" x2="7.5" y2="17" stroke="#d6d6da" stroke-width="1.6"/></svg>
        <svg width="14" height="18" viewBox="0 0 24 24" fill="none" stroke="#d6d6da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </span>
      <div class="mid"><span class="gdot"></span><span class="nm">Tine</span></div>
      <svg width="16" height="10" viewBox="0 0 18 11" fill="none" style="flex:none;"><path d="M1 1.5 L9 9 L17 1.5" stroke="#cfcfd2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- EXPANDED command panel -->
    <div id="panel" class="panel">
      <div class="head">
        <span class="gdot"></span><span class="nm">Tine</span><span class="sp"></span>
        <svg width="22" height="18" viewBox="0 0 24 20" fill="none"><path d="M12 3 L22 7 L12 11 L2 7 Z" stroke="#d6d6da" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 9 V13.5 C18 15 15 16.5 12 16.5 C9 16.5 6 15 6 13.5 V9" stroke="#d6d6da" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg width="20" height="20" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="4.2" stroke="#d6d6da" stroke-width="1.6"/><g stroke="#d6d6da" stroke-width="1.6" stroke-linecap="round"><line x1="11" y1="1.5" x2="11" y2="4"/><line x1="11" y1="18" x2="11" y2="20.5"/><line x1="1.5" y1="11" x2="4" y2="11"/><line x1="18" y1="11" x2="20.5" y2="11"/></g></svg>
      </div>
      <div class="well">
        <span id="ph">Ask Clicky to do something…<span id="caret"></span></span>
        <span id="send"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 14 V4 M4 9 L9 4 L14 9" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div id="log" class="mono"></div>
      <div id="chev"><svg width="18" height="10" viewBox="0 0 18 11" fill="none"><path d="M1 9 L9 1.5 L17 9" stroke="#8a8a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>

    <!-- cursor -->
    <div id="cursor">
      <svg width="26" height="32" viewBox="0 0 26 32" fill="none"><path d="M3 2 L3 24 L9.5 18.5 L13.5 27.5 L17 26 L13 17 L22 17 Z" fill="#0a84ff" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>

  </div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const stage=$('stage'), pill=$('pill'), panel=$('panel'), ph=$('ph'), caret=$('caret'),
        log=$('log'), cursor=$('cursor'), send=$('send');

  function fit(){ const s=Math.min(window.innerWidth/1000, window.innerHeight/650); stage.style.transform='scale('+s+')'; }
  fit(); window.addEventListener('resize', fit); setTimeout(fit,60); setTimeout(fit,250);

  function set(el,o){ for(const k in o) el.style[k]=o[k]; }
  let timers=[];
  function T(ms,fn){ timers.push(setTimeout(fn,ms)); }

  // cursor glide + click
  function moveCursor(x,y){ set(cursor,{opacity:'1', transition:'transform .8s cubic-bezier(.4,0,.2,1), opacity .3s ease', transform:`translate(${x}px,${y}px) scale(1)`}); }
  function pressCursor(x,y){
    cursor.style.transition='transform .12s ease';
    cursor.style.transform=`translate(${x}px,${y}px) scale(0.82)`;
    T(130,()=>{ cursor.style.transform=`translate(${x}px,${y}px) scale(1)`;
      T(150,()=>{ cursor.style.transition='transform .8s cubic-bezier(.4,0,.2,1), opacity .3s ease'; }); });
  }

  // small icons for the log rows
  const IC_USER='<svg class="ic" width="13" height="13" viewBox="0 0 16 16" fill="#9a9a9e"><circle cx="8" cy="5" r="3"/><path d="M2 15c0-3.3 2.7-5 6-5s6 1.7 6 5z"/></svg>';
  // Gmail brand logo (the app the task ran in)
  const GMAIL='<svg viewBox="0 0 256 193"><path fill="#4285F4" d="M58.18 192.05V93.14L27.5 65.08 0 49.5v125.1c0 9.66 7.82 17.45 17.45 17.45z"/><path fill="#34A853" d="M197.82 192.05h40.73c9.65 0 17.45-7.82 17.45-17.45V49.5l-31.16 17.84-27.02 25.8z"/><path fill="#EA4335" d="M58.18 93.14 54 54.5 58.18 17.5 128 69.87l69.82-52.37 4.67 35-4.67 40.64L128 145.5z"/><path fill="#FBBC04" d="M197.82 17.5v75.64L256 49.5V26.23c0-21.58-24.64-33.9-41.9-20.94z"/><path fill="#C5221F" d="M0 49.5 26.76 69.57 58.18 93.14V17.5L41.9 5.29C24.6-7.66 0 4.65 0 26.23z"/></svg>';
  function addRow(cls, icon, text){
    const d=document.createElement('div'); d.className='row '+cls;
    d.innerHTML=(icon||'')+'<span class="tx">'+text+'</span>'; log.appendChild(d); return d;
  }
  // completion card (app icon + result + green ✓), like the voice section's done row
  function addDoneCard(icon, t1, t2){
    const d=document.createElement('div'); d.className='donecard';
    d.innerHTML='<span class="app">'+icon+'</span><div class="meta"><div class="t1">'+t1+'</div><div class="t2">'+t2+'</div></div><span class="chk">✓</span>';
    log.appendChild(d); requestAnimationFrame(()=>d.classList.add('show')); return d;
  }

  // braille "Thinking…" spinner (exact frames from the app)
  const FR=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏']; let spinRow=null, spinI=0, spinT=null;
  function startThink(){ stopThink(); spinRow=addRow('think','', FR[0]+' Thinking…');
    spinT=setInterval(()=>{ spinI=(spinI+1)%FR.length; spinRow.querySelector('.tx').textContent=FR[spinI]+' Thinking…'; }, 85); }
  function stopThink(){ if(spinT){clearInterval(spinT); spinT=null;} if(spinRow){ spinRow.remove(); spinRow=null; } }

  function typeInto(text, dur, done){
    ph.classList.add('typed'); ph.textContent=''; ph.appendChild(caret);
    caret.style.opacity='1'; caret.style.animation='blink .8s steps(1) infinite';
    const chars=[...text]; let i=0; const step=dur/chars.length;
    (function tick(){ if(i<=chars.length){ caret.remove(); ph.textContent=chars.slice(0,i).join(''); ph.appendChild(caret); i++; T(step,tick); } else { done&&done(); } })();
  }

  const CMD='check my unread emails and draft replies';
  const STEPS=['Opened Gmail','Read 4 unread threads','Drafting reply to Sarah…','Drafting reply to the team…'];

  function reset(){
    timers.forEach(clearTimeout); timers=[]; stopThink();
    set(pill,{opacity:'1'}); set(panel,{opacity:'0'}); set(log,{opacity:'0'}); log.innerHTML='';
    ph.classList.remove('typed'); ph.textContent='Ask Clicky to do something…'; ph.appendChild(caret); caret.style.opacity='0';
    set(cursor,{opacity:'0'}); cursor.style.transform='translate(840px,360px) scale(1)';
  }

  // cursor-tip targets (the arrow hotspot is ~3,2 inside the 26×32 svg, so we offset by that)
  const HX=3, HY=2;
  const NOTCH={x:500,y:25}, INPUT={x:360,y:85}, SEND={x:767,y:85};
  function aim(p){ moveCursor(p.x-HX, p.y-HY); }
  function tap(p){ pressCursor(p.x-HX, p.y-HY); }

  function run(){
    reset();
    // 1) cursor → click the notch to open it
    T(500, ()=>{ aim(NOTCH); });
    T(1400,()=>{ tap(NOTCH); });
    T(1750,()=>{ set(pill,{opacity:'0'}); set(panel,{opacity:'1'}); });
    // 2) cursor → click the input field, then type the command
    T(2300,()=>{ aim(INPUT); });
    T(3000,()=>{ tap(INPUT); });
    T(3350,()=>{ set(cursor,{opacity:'0'}); typeInto(CMD, 1500, ()=>{ caret.style.opacity='0'; }); });
    // 3) cursor → click send
    T(5100,()=>{ aim(SEND); });
    T(5800,()=>{ tap(SEND); send.style.background='#e8e8ea'; T(180,()=>send.style.background='#fff'); });
    // 4) the command runs — user row, steps stream, thinking spinner between
    T(6100,()=>{
      set(log,{opacity:'1'});
      ph.classList.remove('typed'); ph.textContent='Ask Clicky to do something…'; ph.appendChild(caret); caret.style.opacity='0';
      addRow('user', IC_USER, CMD); startThink();
    });
    STEPS.forEach((s,i)=>{ T(6700+i*900,()=>{ stopThink(); addRow('step','', '↳ '+s); startThink(); }); });
    // 5) done — completion card with the app icon + result + green check
    T(6700+STEPS.length*900+400,()=>{ stopThink(); addDoneCard(GMAIL, 'Drafted 2 replies in Gmail', 'Ready for your review · 2 threads'); });
    // 6) loop
    T(6700+STEPS.length*900+2600, run);
  }
  run();
})();
</script>
</body>
</html>
